    <!-- Inline Fast Theme Initialization to eliminate FOUC -->

      (function() {
        try {
          var mode = localStorage.getItem('theme-mode');
          if (mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches) || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
